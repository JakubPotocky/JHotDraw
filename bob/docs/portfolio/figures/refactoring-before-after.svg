<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="310" viewBox="0 0 1000 310">
  <rect width="1000" height="310" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#333"/>
    </marker>
  </defs>
  <g font-family="Arial, sans-serif" font-size="14" text-anchor="middle">
    <text x="230" y="35" font-size="19" font-weight="bold">Before</text>
    <rect x="80" y="65" width="300" height="45" rx="5" fill="#ffe8e8" stroke="#9a3333"/>
    <text x="230" y="93">Mac branch duplicate import block</text>
    <rect x="80" y="125" width="300" height="45" rx="5" fill="#ffe8e8" stroke="#9a3333"/>
    <text x="230" y="153">Non-Mac branch duplicate import block</text>
    <rect x="80" y="185" width="300" height="45" rx="5" fill="#ffe8e8" stroke="#9a3333"/>
    <text x="230" y="213">Repeated paste undo edit</text>
    <line x1="405" y1="147" x2="585" y2="147" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="500" y="130" fill="#444">Extract Method</text>
    <text x="760" y="35" font-size="19" font-weight="bold">After</text>
    <rect x="620" y="75" width="280" height="55" rx="5" fill="#e8ffe8" stroke="#286b28"/>
    <text x="760" y="99">importTransferData(...)</text>
    <text x="760" y="117" font-size="12">one shared paste import sequence</text>
    <rect x="620" y="165" width="280" height="55" rx="5" fill="#e8ffe8" stroke="#286b28"/>
    <text x="760" y="189">firePasteUndoableEdit(...)</text>
    <text x="760" y="207" font-size="12">one shared undo/redo registration</text>
    <text x="500" y="280" font-size="13" fill="#444">Figure 4. The duplicated paste code was replaced by named helper methods.</text>
  </g>
</svg>
