name: Java CI with Maven

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 23
      uses: actions/setup-java@v4
      with:
        java-version: '23'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn -B package --settings .maven-settings.xml --file pom.xml
    - name: Run tests with Maven
      run: mvn test --settings .maven-settings.xml --file pom.xml
    - name: Run Main class with Maven Exec
      run: mvn exec:java -Dexec.mainClass=org.jhotdraw.samples.svg.Main --file jhotdraw-samples/jhotdraw-samples-misc/pom.xml
    - name: Update dependency graph
      uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6
